<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Plate &amp; Progress</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #121417;
    --surface: #1B1E23;
    --surface-2: #21252B;
    --line: #2C3038;
    --text: #ECECEC;
    --text-muted: #8A8F98;
    --accent: #F2B705;
    --accent-dim: #6b5a12;
    --warn: #E15554;
    --ok: #4CAF77;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    overscroll-behavior-y: none;
  }
  h1,h2,h3,.label-font{ font-family:'Oswald',sans-serif; letter-spacing:0.02em; }

  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:76px; }

  header{ padding:20px 18px 14px; }
  header .day-title{ font-size:26px; font-weight:700; text-transform:uppercase; margin:0; }
  header .day-sub{ color:var(--text-muted); font-size:13px; margin-top:4px; }

  .bw-bar{
    display:flex; align-items:center; gap:8px; padding:0 18px 14px; margin-top:-6px;
  }
  .bw-bar label{ font-size:12px; color:var(--text-muted); }
  .bw-bar input{
    width:64px; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:5px 6px; font-size:13px; text-align:center;
  }
  .bw-bar input:focus{ outline:none; border-color:var(--accent); }
  .bw-bar span.u{ font-size:12px; color:var(--text-muted); }

  main{ flex:1; padding:0 14px 14px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 14px 12px;
    margin-bottom:12px;
  }
  .ex-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .ex-head-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .ex-icon{
    flex-shrink:0; width:46px; height:46px; border-radius:6px;
    background:var(--surface-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .ex-icon svg{ width:32px; height:32px; }
  .ex-head-text{ min-width:0; }
  .ex-name{ font-size:16px; font-weight:600; margin:0; }
  .ex-last{ font-size:12px; color:var(--text-muted); }
  .ex-range{ font-size:12px; color:var(--text-muted); white-space:nowrap; }

  .weight-row{ display:flex; align-items:center; gap:10px; margin:10px 0 12px; }
  .weight-row .wlabel{ font-size:12px; color:var(--text-muted); min-width:64px; }
  .wbtn{
    width:34px; height:34px; border-radius:6px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-size:18px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
  }
  .wval{
    font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; min-width:64px; text-align:center;
  }
  .wunit{ font-size:12px; color:var(--text-muted); }

  .sets{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  .set-row{ display:flex; align-items:center; gap:8px; }
  .set-row .set-label{ font-size:11px; color:var(--text-muted); min-width:34px; }
  .rbtn{
    width:46px; height:40px; border-radius:6px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-size:20px; font-weight:600;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .set-row input{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:8px 0; text-align:center; font-size:16px; font-family:'Inter',sans-serif;
  }
  .set-row input:focus{ outline:none; border-color:var(--accent); }

  .row-btns{ display:flex; gap:8px; }
  .btn{
    flex:1; padding:10px 8px; border-radius:6px; border:none; font-size:13px; font-weight:600;
    font-family:'Inter',sans-serif; text-transform:uppercase; letter-spacing:0.03em;
  }
  .btn-primary{ background:var(--accent); color:#1a1400; }
  .btn-ghost{ background:transparent; color:var(--text-muted); border:1px solid var(--line); }

  .feedback{
    margin-top:10px; padding:8px 10px; border-radius:6px; font-size:13px; display:none;
    align-items:center; gap:10px;
  }
  .feedback.show{ display:flex; }
  .undo-btn{
    margin-left:auto; flex-shrink:0; background:none; border:1px solid currentColor; color:inherit;
    border-radius:6px; padding:5px 10px; font-size:12px; font-weight:600; font-family:'Inter',sans-serif;
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .feedback.up{ background:rgba(76,175,119,0.12); color:var(--ok); border:1px solid rgba(76,175,119,0.3); }
  .feedback.same{ background:rgba(242,183,5,0.1); color:var(--accent); border:1px solid rgba(242,183,5,0.25); }
  .feedback.down{ background:rgba(225,85,84,0.12); color:var(--warn); border:1px solid rgba(225,85,84,0.3); }

  .history-item{
    display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .history-item:last-child{ border-bottom:none; }
  .history-item .hdate{ color:var(--text-muted); }
  .history-ex-title{ font-size:15px; font-weight:600; margin:18px 0 4px; }

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; max-width:480px; margin:0 auto;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-muted);
    padding:10px 4px 12px; font-family:'Oswald',sans-serif; font-size:12px; text-transform:uppercase;
    letter-spacing:0.03em; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabbar button.active{ color:var(--accent); }
  nav.tabbar .dot{ width:5px; height:5px; border-radius:50%; background:currentColor; opacity:0; }
  nav.tabbar button.active .dot{ opacity:1; }

  .empty-hint{ color:var(--text-muted); font-size:13px; padding:20px 4px; text-align:center; }
  .reset-wrap{ text-align:center; padding:16px 4px 4px; }
  .reset-link{ color:var(--text-muted); font-size:12px; text-decoration:underline; background:none; border:none; }

  .backup-card{ margin-top:6px; }
  .backup-card h3{ font-size:14px; margin:0 0 4px; text-transform:uppercase; }
  .backup-card p{ font-size:12px; color:var(--text-muted); margin:0 0 12px; }
  .backup-row{ display:flex; gap:8px; }
  .file-input{ display:none; }
  .import-status{ font-size:12px; margin-top:8px; display:none; }
  .import-status.show{ display:block; }
  .import-status.ok{ color:var(--ok); }
  .import-status.err{ color:var(--warn); }

  .done-row{
    display:flex; align-items:center; gap:10px; padding:12px; margin-bottom:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
  }
  .done-row .done-check{ color:var(--ok); font-size:16px; flex-shrink:0; }
  .done-row .done-name{
    font-size:14px; font-weight:600; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .done-row .done-info{ font-size:12px; color:var(--text-muted); white-space:nowrap; }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:60;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px 14px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(24px); transition:transform 0.2s;
  }
  .sheet-overlay.show .sheet{ transform:translateY(0); }
  .sheet h3{ margin:0 0 8px; font-size:16px; text-transform:uppercase; }
  .sheet .sheet-body{ font-size:13px; line-height:1.5; margin-bottom:14px; }
  .sheet .sheet-body p{ margin:8px 0; }
  .sheet .sheet-body .muted{ color:var(--text-muted); }
  .sheet .sheet-btns{ display:flex; gap:8px; }
  .btn-danger{ background:var(--warn); color:#fff; }
  .warmup-table{ width:100%; font-size:13px; border-collapse:collapse; margin:10px 0 2px; }
  .warmup-table td{ padding:5px 0; border-bottom:1px solid var(--line); }
  .warmup-table td:last-child{ text-align:right; font-weight:600; }
  .warmup-table tr:last-child td{ border-bottom:none; }

  .spark{ display:block; width:100%; height:44px; margin:2px 0 8px; }

  .nudge{
    background:rgba(242,183,5,0.08); border:1px solid rgba(242,183,5,0.3); color:var(--accent);
    border-radius:6px; padding:10px 12px; font-size:13px; margin-bottom:12px;
  }

  .rest-bar{
    position:fixed; bottom:64px; left:50%; transform:translateX(-50%);
    width:min(452px, calc(100% - 28px));
    background:var(--surface-2); border:1px solid var(--accent-dim); border-radius:8px;
    display:none; align-items:center; gap:12px; padding:10px 14px; z-index:40;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .rest-bar.show{ display:flex; }
  .rest-bar .rest-label{
    font-family:'Oswald',sans-serif; font-size:12px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:0.03em;
  }
  .rest-bar .rest-time{
    font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; color:var(--accent); margin-left:auto;
  }
  .rest-bar .rest-skip{
    background:none; border:1px solid var(--line); color:var(--text-muted);
    border-radius:6px; padding:6px 10px; font-size:12px;
  }

  .toast{
    position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--warn); color:var(--text);
    padding:10px 16px; border-radius:8px; font-size:13px; max-width:90%; text-align:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s, transform 0.2s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 class="day-title" id="dayTitle">Push</h1>
    <div class="day-sub" id="daySub">Chest · Shoulders · Triceps</div>
  </header>
  <div class="bw-bar">
    <label for="bwInput">Bodyweight</label>
    <input type="number" id="bwInput" inputmode="decimal" placeholder="70">
    <span class="u">kg — used to suggest starting weights</span>
  </div>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-tab="push"><span>Push</span><span class="dot"></span></button>
    <button data-tab="pull"><span>Pull</span><span class="dot"></span></button>
    <button data-tab="legs"><span>Legs</span><span class="dot"></span></button>
    <button data-tab="history"><span>History</span><span class="dot"></span></button>
  </nav>
</div>
<div class="sheet-overlay" id="sheetOverlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="rest-bar" id="restBar">
  <span class="rest-label">Rest</span>
  <span class="rest-time" id="restTime">0:00</span>
  <button class="rest-skip" id="restSkip">Skip</button>
</div>

<script>
const DEFAULT_EXERCISES = [
  { id:'chest_press',   day:'push', name:'Chest Press Machine',        low:8,  high:12, size:'large',  sets:3 },
  { id:'shoulder_press', day:'push', name:'Shoulder Press Machine',    low:8,  high:12, size:'large',  sets:3 },
  { id:'pec_deck',      day:'push', name:'Pec Deck / Chest Fly',       low:10, high:15, size:'small',  sets:2 },
  { id:'lateral_raise', day:'push', name:'Lateral Raise Machine',      low:10, high:15, size:'small',  sets:3 },
  { id:'tri_pushdown',  day:'push', name:'Triceps Pushdown',           low:10, high:15, size:'small',  sets:3 },

  { id:'lat_pulldown',  day:'pull', name:'Lat Pulldown Machine',       low:8,  high:12, size:'large',  sets:3 },
  { id:'seated_row',    day:'pull', name:'Seated Cable Row',           low:8,  high:12, size:'large',  sets:3 },
  { id:'rear_delt_fly', day:'pull', name:'Rear Delt Fly Machine',      low:10, high:15, size:'small',  sets:2 },
  { id:'bicep_curl',    day:'pull', name:'Machine / Preacher Curl',    low:10, high:15, size:'small',  sets:3 },
  { id:'ab_crunch',     day:'pull', name:'Ab Crunch Machine',          low:12, high:20, size:'small',  sets:2 },

  { id:'leg_press',     day:'legs', name:'Leg Press',                  low:8,  high:12, size:'legs',   sets:3 },
  { id:'leg_extension', day:'legs', name:'Leg Extension',              low:10, high:15, size:'small',  sets:2 },
  { id:'leg_curl',      day:'legs', name:'Seated / Lying Leg Curl',    low:10, high:15, size:'small',  sets:3 },
  { id:'back_extension', day:'legs', name:'Back Extension',            low:10, high:15, size:'large',  sets:2 },
  { id:'calf_raise',    day:'legs', name:'Calf Raise Machine',         low:12, high:20, size:'small',  sets:3 },
];

const INCREMENTS = { small: 0.04, large: 0.05, legs: 0.075 }; // fraction of current weight
const REST_SECONDS = { small: 90, large: 150, legs: 180 };    // rest between sets
const KG_STEP = 2.5; // smallest weight increment (app is kg-only; most machine stacks move in 5 kg plates with a 2.5 kg add-on)

// Rough beginner starting-weight ratios as a fraction of bodyweight, based on general
// beginner strength guidelines (chest press ~40-60% BW, leg press ~50-75% BW, etc.)
// These are conservative starting points, not targets — always adjust down if form breaks.
const BW_RATIO = {
  chest_press: 0.40, shoulder_press: 0.30, pec_deck: 0.20, lateral_raise: 0.10, tri_pushdown: 0.15,
  lat_pulldown: 0.30, seated_row: 0.30, rear_delt_fly: 0.10, bicep_curl: 0.15, ab_crunch: 0.20,
  leg_press: 0.50, leg_extension: 0.25, leg_curl: 0.25, back_extension: 0.25, calf_raise: 0.35,

// Original simple pictogram icons (not photos) so machines are easy to ID at a glance.

  `,

    <path d="M32 40 L26 58"/><path d="M32 40 L38 58"/>

function iconSvg(id){
  const path = ICON_PATHS[id] || '';
  return `<svg viewBox="0 0 64 64" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
const DAY_LABELS = {
  push: ['Push', 'Chest · Shoulders · Triceps'],
  pull: ['Pull', 'Back · Biceps'],
  legs: ['Legs', 'Quads · Hamstrings · Calves'],
};

let state = null; // { exercises: { id: {weight, unit, fails, lastResult} }, history: [ {id, date, weight, reps:[], result} ], bodyweight, lastBackup }
let activeTab = 'push';
const expandedToday = new Set(); // logged-today cards the user re-opened this session

function defaultState(){
  const exercises = {};
  DEFAULT_EXERCISES.forEach(e => {
    exercises[e.id] = { weight: null, unit: 'kg', fails: 0 };
  });
  return { exercises, history: [], bodyweight: null, lastBackup: null };
}

async function loadState(){
  try{
    const raw = localStorage.getItem('tracker-data');
    const res = raw ? { value: raw } : null;
    const loaded = res && res.value ? JSON.parse(res.value) : null;
    state = loaded ? Object.assign(defaultState(), loaded) : defaultState();
    // make sure every default exercise exists even if saved state predates it
    DEFAULT_EXERCISES.forEach(e => { if(!state.exercises[e.id]) state.exercises[e.id] = { weight:null, unit:'kg', fails:0 }; });
  }catch(e){
    state = defaultState();
    showToast('Could not load saved data — starting fresh. Storage may be briefly unavailable.');
  }
  activeTab = suggestDay();
  render();
  wireBodyweight();
}

function showToast(msg, persist){
  const el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  if(!persist){
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove('show'), 3500);
  }
}
function hideToast(){
  const el = document.getElementById('toast');
  if(el) el.classList.remove('show');
}

function wireBodyweight(){
  const bwInput = document.getElementById('bwInput');
  bwInput.value = state.bodyweight || '';
  bwInput.oninput = () => {
    const v = parseFloat(bwInput.value);
    state.bodyweight = isNaN(v) ? null : v;
    saveState();
  };
}

async function saveState(retriesLeft){
  if(retriesLeft === undefined) retriesLeft = 1;
  try{
    localStorage.setItem('tracker-data', JSON.stringify(state));
    hideToast();
    return true;
  }catch(e){
    console.error('save failed', e);
    if(retriesLeft > 0){
      await new Promise(r => setTimeout(r, 600));
      return saveState(retriesLeft - 1);
    }
    showToast('⚠ Last change may not have saved — check your connection and try again.', true);
    return false;
  }
}

function roundToStep(val){
  return Math.round(val / KG_STEP) * KG_STEP;
}
// Increases always land at least one full step above, deloads at least one
// below — plain rounding would leave small-percentage changes at the same
// weight on light loads.
function roundUpToStep(val){
  return Math.ceil(val / KG_STEP) * KG_STEP;
}
function roundDownToStep(val){
  return Math.max(KG_STEP, Math.floor(val / KG_STEP) * KG_STEP);
}

function exById(id){ return DEFAULT_EXERCISES.find(e => e.id === id); }
function lastEntryFor(id){ return state.history.find(h => h.id === id) || null; }
function isToday(iso){ return new Date(iso).toDateString() === new Date().toDateString(); }
function loggedToday(id){ const le = lastEntryFor(id); return !!(le && isToday(le.date)); }

// Open the app on the day you're most likely training: the day already
// started today, otherwise the next one in the Push → Pull → Legs rotation.
function suggestDay(){
  if(!state.history.length) return 'push';
  const last = state.history[0];
  const ex = exById(last.id);
  const lastDay = ex ? ex.day : 'push';
  if(isToday(last.date)) return lastDay;
  const order = ['push', 'pull', 'legs'];
  return order[(order.indexOf(lastDay) + 1) % order.length];
}

function showSheet(title, bodyHTML, buttons){
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `<h3></h3><div class="sheet-body">${bodyHTML}</div><div class="sheet-btns"></div>`;
  sheet.querySelector('h3').textContent = title;
  const btnWrap = sheet.querySelector('.sheet-btns');
  (buttons || [{ label: 'Got it', cls: 'btn-primary' }]).forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls || 'btn-ghost');
    btn.textContent = b.label;
    btn.onclick = () => { hideSheet(); if(b.onClick) b.onClick(); };
    btnWrap.appendChild(btn);
  });
  document.getElementById('sheetOverlay').classList.add('show');
}
function hideSheet(){ document.getElementById('sheetOverlay').classList.remove('show'); }

let restInterval = null;
function stopRest(){
  clearInterval(restInterval);
  restInterval = null;
  document.getElementById('restBar').classList.remove('show');
}
function fmtTime(s){
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function startRest(seconds){
  clearInterval(restInterval);
  const timeEl = document.getElementById('restTime');
  timeEl.textContent = fmtTime(seconds);
  document.getElementById('restBar').classList.add('show');
  const startedAt = Date.now();
  restInterval = setInterval(() => {
    const remaining = seconds - Math.round((Date.now() - startedAt) / 1000);
    if(remaining <= 0){
      stopRest();
      showToast('Rest over — next set.');
    } else {
      timeEl.textContent = fmtTime(remaining);
    }
  }, 250);
}

function renderTabs(){
  document.querySelectorAll('nav.tabbar button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab === activeTab);
  });
  if(activeTab !== 'history'){
    document.getElementById('dayTitle').textContent = DAY_LABELS[activeTab][0];
    document.getElementById('daySub').textContent = DAY_LABELS[activeTab][1];
  }else{
    document.getElementById('dayTitle').textContent = 'History';
    document.getElementById('daySub').textContent = 'Every logged session';
  }
}

function render(){
  renderTabs();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(activeTab === 'history'){ renderHistory(main); return; }

  const list = DEFAULT_EXERCISES.filter(e => e.day === activeTab);
  list.forEach(ex => {
    if(loggedToday(ex.id) && !expandedToday.has(ex.id)){
      main.appendChild(renderDoneRow(ex));
    } else {
      main.appendChild(renderExerciseCard(ex));
    }
  });

  const resetWrap = document.createElement('div');
  resetWrap.className = 'reset-wrap';
  resetWrap.innerHTML = `<button class="reset-link" id="resetBtn">Reset all data</button>`;
  main.appendChild(resetWrap);
  document.getElementById('resetBtn').onclick = () => {
    showSheet('Reset all data', 'This clears every weight and all history. It cannot be undone.', [
      { label: 'Cancel', cls: 'btn-ghost' },
      { label: 'Reset', cls: 'btn-danger', onClick: async () => {
        state = defaultState();
        await saveState();
        render();
        wireBodyweight();
      }}
    ]);
  };
}

function renderDoneRow(ex){
  const le = lastEntryFor(ex.id);
  const row = document.createElement('div');
  row.className = 'done-row';
  row.innerHTML = `<span class="done-check">✓</span><span class="done-name"></span><span class="done-info"></span>`;
  row.querySelector('.done-name').textContent = ex.name;
  row.querySelector('.done-info').textContent = le ? `${le.weight} kg × ${le.reps.join(', ')}` : '';
  // swap in place — a full render() would wipe reps typed into other cards
  row.onclick = () => {
    expandedToday.add(ex.id);
    row.replaceWith(renderExerciseCard(ex));
  };
  return row;
}

function renderExerciseCard(ex){
  const data = state.exercises[ex.id];
  const card = document.createElement('div');
  card.className = 'card';

  const weightDisplay = data.weight === null ? '—' : data.weight;

  card.innerHTML = `
    <div class="ex-head">
      <div class="ex-head-left">
        <div class="ex-icon">${iconSvg(ex.id)}</div>
        <div class="ex-head-text">
          <p class="ex-name">${ex.name}</p>
          <span class="ex-last" data-role="last"></span>
        </div>
      </div>
      <span class="ex-range">${ex.low}–${ex.high} reps</span>
    </div>
    <div class="weight-row">
      <span class="wlabel">Working wt</span>
      <button class="wbtn" data-act="minus">−</button>
      <span class="wval" data-role="wval">${weightDisplay}</span>
      <button class="wbtn" data-act="plus">+</button>
      <span class="wunit">kg</span>
    </div>
    <div class="sets" data-role="sets"></div>
    <div class="row-btns">
      <button class="btn btn-ghost" data-act="find">Find start weight</button>
      <button class="btn btn-primary" data-act="log">Log session</button>
    </div>
    <div class="feedback" data-role="feedback"></div>
  `;

  const lastEl = card.querySelector('[data-role="last"]');
  function updateLast(){
    const le = lastEntryFor(ex.id);
    lastEl.textContent = le ? `Last: ${le.weight} kg × ${le.reps.join(', ')}` : 'No sessions yet';
  }
  updateLast();

  const setsWrap = card.querySelector('[data-role="sets"]');
  for(let i=0;i<ex.sets;i++){
    const row = document.createElement('div');
    row.className = 'set-row';
    row.innerHTML = `<span class="set-label">Set ${i+1}</span>
      <button class="rbtn" data-rb="minus">−</button>
      <input type="number" inputmode="numeric" min="0" placeholder="reps">
      <button class="rbtn" data-rb="plus">+</button>`;
    const input = row.querySelector('input');
    // Empty input + tap = prefill with last session's reps for this set (or the
    // top of the rep range), so logging a typical set is one or two taps.
    const prefill = () => {
      const le = lastEntryFor(ex.id);
      return (le && le.reps[i] != null) ? le.reps[i] : ex.high;
    };
    row.querySelector('[data-rb="plus"]').onclick = () => {
      input.value = input.value === '' ? prefill() : parseInt(input.value, 10) + 1;
      startRest(REST_SECONDS[ex.size]);
    };
    row.querySelector('[data-rb="minus"]').onclick = () => {
      input.value = input.value === '' ? prefill() : Math.max(0, parseInt(input.value, 10) - 1);
      startRest(REST_SECONDS[ex.size]);
    };
    input.addEventListener('change', () => { if(input.value !== '') startRest(REST_SECONDS[ex.size]); });
    setsWrap.appendChild(row);
  }

  const wvalEl = card.querySelector('[data-role="wval"]');
  card.querySelector('[data-act="minus"]').onclick = () => {
    data.weight = Math.max(0, (data.weight || KG_STEP) - KG_STEP);
    wvalEl.textContent = data.weight;
    saveState();
  };
  card.querySelector('[data-act="plus"]').onclick = () => {
    data.weight = (data.weight || 0) + KG_STEP;
    wvalEl.textContent = data.weight;
    saveState();
  };
  card.querySelector('[data-act="find"]').onclick = () => {
    let suggestion;
    if(state.bodyweight && BW_RATIO[ex.id]){
      suggestion = roundToStep(state.bodyweight * BW_RATIO[ex.id]);
    } else {
      suggestion = 10;
    }
    if(data.weight === null){ data.weight = suggestion; }
    wvalEl.textContent = data.weight;
    saveState();
    const w = data.weight;
    const warm1 = Math.max(KG_STEP, roundToStep(w * 0.5));
    const warm2 = Math.max(KG_STEP, roundToStep(w * 0.75));
    const bwNote = state.bodyweight
      ? `Starting point based on your bodyweight: <strong>${suggestion} kg</strong>.`
      : `<span class="muted">Tip: enter your bodyweight at the top for a smarter suggestion.</span>`;
    showSheet(ex.name, `
      ${bwNote}
      <p>Adjust with +/− until you can just complete ${ex.low} reps with ~2 left in reserve — that's your working weight.</p>
      <table class="warmup-table">
        <tr><td>Warm-up 1</td><td>${warm1} kg × 10</td></tr>
        <tr><td>Warm-up 2</td><td>${warm2} kg × 5</td></tr>
        <tr><td>Work sets</td><td>${w} kg × ${ex.low}–${ex.high}</td></tr>
      </table>
    `);
  };

  const fbEl = card.querySelector('[data-role="feedback"]');
  card.querySelector('[data-act="log"]').onclick = () => {
    const inputs = Array.from(setsWrap.querySelectorAll('input'));
    const reps = inputs.map(i => i.value === '' ? null : parseInt(i.value,10));
    if(reps.some(r => r === null || isNaN(r))){
      fbEl.className = 'feedback show down';
      fbEl.textContent = 'Enter reps for every set first.';
      return;
    }
    if(data.weight === null){
      fbEl.className = 'feedback show down';
      fbEl.textContent = 'Set a starting weight first (use "Find start weight" or +/-).';
      return;
    }
    const allTop = reps.every(r => r >= ex.high);
    const allBottom = reps.every(r => r >= ex.low);
    // Snapshot pre-log values: history records the weight actually lifted,
    // and Undo needs to restore both weight and the fails counter.
    const prevWeight = data.weight;
    const prevFails = data.fails || 0;
    let result, msg, cls;

    if(allTop){
      const pct = INCREMENTS[ex.size];
      const newWeight = roundUpToStep(data.weight * (1 + pct));
      result = 'increase';
      msg = `All sets hit ${ex.high}+. Next session: ${newWeight} kg (was ${data.weight}).`;
      cls = 'up';
      data.weight = newWeight;
      data.fails = 0;
    } else if(allBottom){
      result = 'hold';
      msg = `Solid — within range but not yet at ${ex.high}. Repeat ${data.weight} kg next time.`;
      cls = 'same';
      data.fails = 0;
    } else {
      data.fails = (data.fails || 0) + 1;
      if(data.fails >= 2){
        const newWeight = roundDownToStep(data.weight * 0.9);
        result = 'decrease';
        msg = `Missed ${ex.low} reps two sessions running. Dropping to ${newWeight} kg to rebuild.`;
        cls = 'down';
        data.weight = newWeight;
        data.fails = 0;
      } else {
        result = 'miss';
        msg = `Missed ${ex.low} reps on at least one set. Keep ${data.weight} kg — one more miss and we'll deload.`;
        cls = 'down';
      }
    }

    const entry = {
      id: ex.id, name: ex.name, date: new Date().toISOString(),
      weight: prevWeight, unit: 'kg', reps, result
    };
    state.history.unshift(entry);
    saveState();

    fbEl.className = 'feedback show ' + cls;
    fbEl.innerHTML = '';
    const msgSpan = document.createElement('span');
    msgSpan.textContent = msg;
    const undoBtn = document.createElement('button');
    undoBtn.className = 'undo-btn';
    undoBtn.textContent = 'Undo';
    fbEl.appendChild(msgSpan);
    fbEl.appendChild(undoBtn);
    clearTimeout(card._undoT);
    card._undoT = setTimeout(() => {
      undoBtn.remove();
      // undo window over — shrink to a done-row so the next exercise is in reach
      if(loggedToday(ex.id) && card.isConnected){
        expandedToday.delete(ex.id);
        card.replaceWith(renderDoneRow(ex));
      }
    }, 10000);
    undoBtn.onclick = () => {
      clearTimeout(card._undoT);
      const idx = state.history.indexOf(entry);
      if(idx !== -1) state.history.splice(idx, 1);
      data.weight = prevWeight;
      data.fails = prevFails;
      saveState();
      inputs.forEach((inp, i) => inp.value = reps[i]);
      wvalEl.textContent = data.weight;
      fbEl.className = 'feedback';
      fbEl.innerHTML = '';
      updateLast();
    };

    wvalEl.textContent = data.weight;
    inputs.forEach(i => i.value = '');
    updateLast();

    // whole day logged? show the session summary
    const dayExs = DEFAULT_EXERCISES.filter(d => d.day === ex.day);
    if(dayExs.every(d => loggedToday(d.id))){
      const results = dayExs.map(d => lastEntryFor(d.id).result);
      const count = r => results.filter(x => x === r).length;
      const parts = [];
      if(count('increase')) parts.push(`${count('increase')} increase${count('increase') > 1 ? 's' : ''}`);
      if(count('hold')) parts.push(`${count('hold')} hold${count('hold') > 1 ? 's' : ''}`);
      const misses = count('miss') + count('decrease');
      if(misses) parts.push(`${misses} miss${misses > 1 ? 'es' : ''}`);
      const weekDays = new Set(
        state.history
          .filter(h => Date.now() - new Date(h.date).getTime() < 7 * 86400000)
          .map(h => new Date(h.date).toDateString())
      ).size;
      setTimeout(() => {
        showSheet(`${DAY_LABELS[ex.day][0]} day done`, `
          <strong>${parts.join(' · ')}</strong>
          <p class="muted">${weekDays} workout day${weekDays > 1 ? 's' : ''} in the last 7. See you next session.</p>
        `, [{ label: 'Nice', cls: 'btn-primary' }]);
      }, 500);
    }
  };

  return card;
}

function renderBackupCard(main){
  const card = document.createElement('div');
  card.className = 'card backup-card';
  card.innerHTML = `
    <h3>Backup</h3>
    <p>Export a copy of your weights and history, or restore from a previous export.</p>
    <div class="backup-row">
      <button class="btn btn-ghost" id="exportBtn">Export data</button>
      <button class="btn btn-ghost" id="importBtn">Import data</button>
    </div>
    <input type="file" accept="application/json" class="file-input" id="fileInput">
    <div class="import-status" id="importStatus"></div>
  `;
  main.appendChild(card);

  card.querySelector('#exportBtn').onclick = exportData;
  const fileInput = card.querySelector('#fileInput');
  card.querySelector('#importBtn').onclick = () => fileInput.click();
  fileInput.onchange = (e) => handleImportFile(e, card.querySelector('#importStatus'));
}

async function exportData(){
  const dataStr = JSON.stringify(state, null, 2);
  const fname = 'lift-tracker-backup-' + new Date().toISOString().slice(0,10) + '.json';
  let shared = false;
  // Web Share first (goes straight to Drive/messaging on Android); download as fallback
  if(navigator.canShare){
    try{
      const file = new File([dataStr], fname, { type: 'application/json' });
      if(navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: 'Plate & Progress backup' });
        shared = true;
      }
    }catch(err){
      if(err && err.name === 'AbortError') return; // user closed the share sheet — not backed up
    }
  }
  if(!shared){
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  state.lastBackup = new Date().toISOString();
  await saveState();
  render(); // only reachable from the History tab, so no in-progress reps to lose
}

function handleImportFile(e, statusEl){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed.exercises || !parsed.history){
        throw new Error('missing fields');
      }
      showSheet('Import backup', `This backup holds ${parsed.history.length} logged session${parsed.history.length === 1 ? '' : 's'}. Importing replaces everything currently in the app.`, [
        { label: 'Cancel', cls: 'btn-ghost' },
        { label: 'Replace data', cls: 'btn-danger', onClick: async () => {
          state = Object.assign(defaultState(), parsed);
          DEFAULT_EXERCISES.forEach(ex => { if(!state.exercises[ex.id]) state.exercises[ex.id] = { weight:null, unit:'kg', fails:0 }; });
          await saveState();
          render();
          wireBodyweight();
          const st = document.getElementById('importStatus');
          if(st){ st.className = 'import-status show ok'; st.textContent = 'Import successful.'; }
        }}
      ]);
    }catch(err){
      statusEl.className = 'import-status show err';
      statusEl.textContent = 'Could not read that file — make sure it is a backup exported from this app.';
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function sparkline(entries){ // entries newest-first, needs >= 2 points
  const pts = entries.slice().reverse().map(h => h.weight);
  if(pts.length < 2) return '';
  const min = Math.min(...pts), max = Math.max(...pts);
  const W = 300, H = 44, pad = 5;
  const x = i => pad + i * (W - 2 * pad) / (pts.length - 1);
  const y = v => max === min ? H / 2 : pad + (H - 2 * pad) * (1 - (v - min) / (max - min));
  const poly = pts.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1])}" r="3" fill="var(--accent)"/>
  </svg>`;
}

function backupNudge(){
  if(state.history.length < 5) return null;
  const days = state.lastBackup
    ? Math.floor((Date.now() - new Date(state.lastBackup).getTime()) / 86400000)
    : null;
  if(days !== null && days < 14) return null;
  const div = document.createElement('div');
  div.className = 'nudge';
  div.textContent = days === null
    ? 'Your training history lives only on this device — export a backup below.'
    : `Last backup ${days} days ago — export a fresh one below.`;
  return div;
}

function renderHistory(main){
  if(!state.history.length){
    main.innerHTML = '<div class="empty-hint">No sessions logged yet. Log one from Push, Pull, or Legs to see it here.</div>';
    renderBackupCard(main);
    return;
  }
  const nudge = backupNudge();
  if(nudge) main.appendChild(nudge);
  const grouped = {};
  state.history.forEach(h => {
    grouped[h.id] = grouped[h.id] || [];
    grouped[h.id].push(h);
  });
  Object.keys(grouped).forEach(id => {
    const title = document.createElement('div');
    title.className = 'history-ex-title';
    title.style.display = 'flex';
    title.style.alignItems = 'center';
    title.style.gap = '8px';
    title.innerHTML = `<span class="ex-icon" style="width:28px;height:28px;">${iconSvg(id).replace('viewBox', 'style="width:20px;height:20px" viewBox')}</span> ${grouped[id][0].name}`;
    main.appendChild(title);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = sparkline(grouped[id]);
    grouped[id].slice(0,10).forEach(h => {
      const d = new Date(h.date);
      const dateStr = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
      const row = document.createElement('div');
      row.className = 'history-item';
      row.innerHTML = `<span class="hdate">${dateStr}</span><span>${h.weight}${h.unit} × [${h.reps.join(', ')}]</span>`;
      card.appendChild(row);
    });
    main.appendChild(card);
  });
  renderBackupCard(main);
}

document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    render();
  });
});

document.getElementById('restSkip').onclick = stopRest;
document.getElementById('sheetOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'sheetOverlay') hideSheet();
});

loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
